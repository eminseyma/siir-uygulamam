<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şiirlerim Sana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Şiirler">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Yerleşim: tek sütun, süzülen kalplerin üstünde cam efektli yuvarlak kartlar. Şiir elyazısı fontuyla, arayüz yuvarlak hatlı fontla. */
:root{
  --bg:#ffeef3; --bg2:#f6eaff; --surface:rgba(255,255,255,.78); --surface-solid:#fff7fa; --ink:#4b2a3b; --muted:#94697d;
  --rose:#ee5f86; --rose2:#ff8fab; --rose-ink:#ffffff; --lav:#c9a7ee; --line:rgba(238,95,134,.22); --ok:#2f8f66; --shadow:0 10px 30px rgba(238,95,134,.16);
  --display:'Pacifico','Quicksand',cursive;
  --hand:'Caveat','Quicksand',cursive;
  --body:'Quicksand',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#261a30; --bg2:#37203f; --surface:rgba(66,42,78,.72); --surface-solid:#3a2646; --ink:#fbeaf1; --muted:#c5a3b8;
  --rose:#ff8fab; --rose2:#ffb3c7; --rose-ink:#3b1226; --lav:#b79be0; --line:rgba(255,143,171,.26); --ok:#7fd1a8; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#261a30; --bg2:#37203f; --surface:rgba(66,42,78,.72); --surface-solid:#3a2646; --ink:#fbeaf1; --muted:#c5a3b8;
  --rose:#ff8fab; --rose2:#ffb3c7; --rose-ink:#3b1226; --lav:#b79be0; --line:rgba(255,143,171,.26); --ok:#7fd1a8; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html[data-size="s"]{--poem-size:1.45rem}
html[data-size="m"]{--poem-size:1.75rem}
html[data-size="l"]{--poem-size:2.1rem}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;line-height:1.55;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:30px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.25;color:var(--rose)}
h2{font-family:var(--body);font-weight:700;font-size:1.15rem}
.sub{margin:-12px 0 0;color:var(--muted);font-size:.95rem}
.muted{color:var(--muted);font-size:.92rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);border:0;border-radius:999px;padding:13px 24px;font-weight:700;min-height:48px;box-shadow:var(--shadow);transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;color:var(--muted);font-weight:600}
input[type=text],input[type=password],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;width:100%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
textarea{min-height:220px;resize:vertical;font-family:var(--hand);font-size:1.5rem;line-height:1.35}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--muted);font-weight:700}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);border-color:transparent}
.poem{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:30px 24px 22px;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.poem.latest::before{content:"♥";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);font-size:1.1rem;box-shadow:var(--shadow)}
.poem h2{font-family:var(--body);font-weight:700;font-size:1.25rem;margin-bottom:12px;color:var(--rose);text-align:center}
.poem .text{font-family:var(--hand);font-size:var(--poem-size,1.75rem);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.poem .date{margin-top:18px;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.chip{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--muted);min-height:42px;font-size:.92rem;font-weight:700}
.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--rose2),var(--rose));border-color:transparent;color:var(--rose-ink)}
.badge{display:inline-block;background:var(--lav);color:#fff;font-family:var(--body);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:8px}
.archive{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;text-align:left;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;width:100%;min-width:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.item span:first-child{font-family:var(--hand);font-size:1.4rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span:last-child{color:var(--muted);font-size:.78rem;flex:none;align-self:center;font-weight:600}
.item[aria-expanded=true]{border-color:var(--rose)}
.archive .poem{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--rose)}
.notice{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:16px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.status{min-height:1.4em;font-size:.92rem;color:var(--ok);font-weight:600}
.status.err{color:var(--rose)}
.panel{display:flex;flex-direction:column;gap:18px}
hr{border:0;border-top:1.5px dashed var(--line);width:100%;margin:6px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9rem;min-width:0;font-weight:600}
.stat b{font-variant-numeric:tabular-nums}
.offline{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:.88rem;color:var(--muted)}
.heart{color:var(--rose)}
.count{font-size:.8rem;color:var(--muted);text-align:right}
.preview{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;font-size:.92rem}
.preview b{display:block}
.itemrow{display:flex;align-items:center;gap:8px}
.itemrow .item{flex:1}
.itemrow .item span:last-child{display:none}
.mini{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.82rem;min-height:42px;font-weight:700}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px}
.empty .big{font-family:var(--hand);font-size:1.8rem;line-height:1.3;color:var(--rose)}
@media (prefers-reduced-motion:no-preference){
  .poem{animation:in .6s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}}
  .poem.latest::before{animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}}
}
</style>
</head>
<body>
<canvas id="hearts" aria-hidden="true"></canvas>
<main id="app"></main>
<script>
(() => {
  const cv = document.getElementById('hearts'); if (!cv) return;
  const ctx = cv.getContext('2d'); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, hearts = [], colors = [], raf = 0, last = 0;
  const readColors = () => { const cs = getComputedStyle(document.documentElement);
    colors = ['--rose', '--rose2', '--lav'].map(k => cs.getPropertyValue(k).trim() || '#ee5f86'); };
  function path(s) { ctx.beginPath(); ctx.moveTo(0, s * .32); ctx.bezierCurveTo(-s * .56, -s * .12, -s * .38, -s * .62, 0, -s * .28);
    ctx.bezierCurveTo(s * .38, -s * .62, s * .56, -s * .12, 0, s * .32); ctx.closePath(); }
  function make(init) { const size = 8 + Math.random() * 20;
    return { x: Math.random() * W, y: init ? Math.random() * H : H + size, s: size, v: 8 + Math.random() * 18, sw: 6 + Math.random() * 14,
      ph: Math.random() * 6.28, sp: .4 + Math.random() * .8, rot: (Math.random() - .5) * .8, c: Math.floor(Math.random() * 3),
      a: .28 + Math.random() * .42, out: Math.random() < .35 }; }
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(Math.min(56, Math.max(28, W * H / 11000))); hearts = Array.from({ length: n }, () => make(true)); readColors(); if (reduce) draw(0); }
  function draw(t) { ctx.clearRect(0, 0, W, H);
    for (const h of hearts) { const x = h.x + Math.sin(t * h.sp + h.ph) * h.sw;
      ctx.save(); ctx.translate(x, h.y); ctx.rotate(h.rot + Math.sin(t * h.sp + h.ph) * .15); ctx.globalAlpha = h.a;
      path(h.s); if (h.out) { ctx.strokeStyle = colors[h.c]; ctx.lineWidth = 1.6; ctx.stroke(); } else { ctx.fillStyle = colors[h.c]; ctx.fill(); }
      ctx.restore(); } }
  function tick(ts) { const dt = Math.min((ts - last) / 1000 || 0, .1); last = ts;
    for (const h of hearts) { h.y -= h.v * dt; if (h.y < -h.s * 2) Object.assign(h, make(false), { x: Math.random() * W }); }
    draw(ts / 1000); raf = requestAnimationFrame(tick); }
  function start() { if (reduce || raf) return; last = performance.now(); raf = requestAnimationFrame(tick); }
  function stop() { cancelAnimationFrame(raf); raf = 0; }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { readColors(); if (reduce) draw(0); });
  resize(); start();
})();
</script>
<script>
const API = 'https://okgnefzgvkzbzrzizoqv.supabase.co/functions/v1/poem-api';
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, ...kids) => { const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) { if (v === false || v == null) continue; if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v); }
  kids.flat().forEach(c => n.append(c && c.nodeType ? c : document.createTextNode(c ?? ''))); return n; };
const store = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} },
                del: k => { try { localStorage.removeItem(k) } catch (e) {} } };
const jget = (k, d) => { try { return JSON.parse(store.get(k)) ?? d } catch (e) { return d } };

let code = store.get('code'), role = null, vapid = null, poems = jget('poems', []), tab = 'read', offline = false;
let editing = null, stats = null, seen = new Set(jget('seen', []));
document.documentElement.dataset.size = store.get('size') || 'm';

const hashCode = (location.hash.match(/k=([\w-]+)/) || [])[1];
if (hashCode) { code = hashCode; store.set('code', code); history.replaceState(null, '', location.pathname); }

async function api(action, extra = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'hata'), { status: r.status });
  return j;
}
const fmt = d => new Date(d).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
const app = $('#app');
const firstLine = p => p.title || p.body.split('\n')[0];

function gate(msg) {
  const input = el('input', { id: 'code', type: 'password', autocomplete: 'off', autocapitalize: 'off', inputmode: 'text' });
  const go = async () => { code = input.value.trim(); if (!code) return; store.set('code', code); await boot(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  app.replaceChildren(
    el('h1', {}, 'Şiirlerim Sana'),
    el('p', { class: 'muted' }, 'Sana verilen kodu bir kez gir, sonra bir daha sorulmaz. ♥'),
    el('div', { class: 'field' }, el('label', { for: 'code' }, 'Kod'), input),
    el('button', { class: 'btn', onclick: go }, 'Gir'),
    el('div', { class: 'status err', role: 'status' }, msg || '')
  );
}

async function refresh(silent) {
  try {
    poems = (await api('list')).poems; offline = false;
    store.set('poems', JSON.stringify(poems));
    if (role === 'admin') { try { stats = await api('stats'); } catch (e) {} }
  } catch (e) {
    if (e.status === 401) throw e;
    offline = true;
  }
  if (!silent) render();
}

async function boot() {
  if (!code) return gate();
  try {
    const c = await api('config'); role = c.role; vapid = c.vapid_public; store.set('role', role);
    await refresh(true);
  } catch (e) {
    if (e.status === 401) { store.del('code'); code = null; return gate('Kod yanlış, tekrar dene.'); }
    role = store.get('role'); offline = true;
    if (!role || !poems.length) {
      app.replaceChildren(el('p', {}, 'Bağlanılamadı. İnternetini kontrol edip tekrar dene.'), el('button', { class: 'btn', onclick: boot }, 'Tekrar dene'));
      return;
    }
  }
  render(); resync();
}

// Bildirim izni verilmişse aboneliği her açılışta sessizce tazele (iOS abonelikleri zamanla geçersiz olabiliyor).
async function resync() {
  if (role !== 'reader' || !('serviceWorker' in navigator) || !('PushManager' in window) || !vapid) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(vapid) });
    await api('subscribe', { subscription: sub.toJSON() });
  } catch (e) {}
}

function markSeen() {
  if (role !== 'reader' || tab !== 'read') return;
  poems.forEach(p => seen.add(p.id)); store.set('seen', JSON.stringify([...seen]));
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
}

function render() {
  const top = el('div', { class: 'top' }, el('h1', {}, 'Şiirlerim Sana'));
  const subtitle = role === 'reader' ? el('p', { class: 'sub' }, 'Her satırı senin için ♥') : '';
  if (role === 'admin') {
    top.append(el('div', { class: 'tabs', role: 'tablist' },
      el('button', { role: 'tab', 'aria-selected': String(tab === 'read'), onclick: () => { tab = 'read'; render(); } }, 'Oku'),
      el('button', { role: 'tab', 'aria-selected': String(tab === 'write'), onclick: () => { tab = 'write'; render(); } }, 'Yaz')));
  }
  const view = tab === 'write' && role === 'admin' ? writeView() : readView();
  app.replaceChildren(top, subtitle, offline ? el('div', { class: 'offline' }, 'Çevrimdışısın. Son kaydedilen şiirler gösteriliyor.') : '', view);
  markSeen();
}

async function copyText(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Kopyalandı'; }
  catch (e) { btn.textContent = 'Kopyalanamadı'; }
  setTimeout(() => btn.textContent = old, 1500);
}

function sizeChip() {
  const order = ['s', 'm', 'l'];
  return el('button', { class: 'chip', 'aria-label': 'Yazı boyutunu değiştir', onclick: () => {
    const cur = document.documentElement.dataset.size || 'm';
    const next = order[(order.indexOf(cur) + 1) % 3];
    document.documentElement.dataset.size = next; store.set('size', next);
  } }, 'Aa');
}

function poemCard(p, latest, isNew) {
  const likeBtn = el('button', { class: 'chip', 'aria-pressed': String(!!p.liked), onclick: async () => {
    const next = !p.liked; p.liked = next; likeBtn.setAttribute('aria-pressed', String(next)); likeBtn.textContent = next ? '♥ Beğendim' : '♡ Beğen';
    store.set('poems', JSON.stringify(poems));
    try { await api('like', { id: p.id, liked: next }); } catch (e) { p.liked = !next; likeBtn.setAttribute('aria-pressed', String(!next)); likeBtn.textContent = !next ? '♥ Beğendim' : '♡ Beğen'; }
  } }, p.liked ? '♥ Beğendim' : '♡ Beğen');
  const copyBtn = el('button', { class: 'chip', onclick: () => copyText((p.title ? p.title + '\n\n' : '') + p.body, copyBtn) }, 'Kopyala');
  return el('article', { class: 'poem' + (latest ? ' latest' : '') },
    p.title ? el('h2', {}, p.title, isNew ? el('span', { class: 'badge' }, 'Yeni') : '') : (isNew ? el('span', { class: 'badge' }, 'Yeni') : ''),
    el('div', { class: 'text' }, p.body),
    el('div', { class: 'date' }, fmt(p.created_at) + (p.updated_at ? ' · düzenlendi' : '')),
    el('div', { class: 'actions' }, likeBtn, copyBtn, sizeChip()));
}

function readView() {
  const box = el('div', { class: 'panel' });
  if (role === 'reader') box.append(notifBox());
  if (!poems.length) {
    box.append(el('div', { class: 'empty' }, el('div', { class: 'big' }, 'Şiirlerin burada olacak ♥'),
      el('div', { class: 'muted' }, 'İlk şiir gelince bildirimle haber vereceğim.'),
      el('button', { class: 'btn ghost', onclick: () => refresh() }, 'Yenile')));
    return box;
  }
  const isNew = p => role === 'reader' && !seen.has(p.id);
  box.append(poemCard(poems[0], true, isNew(poems[0])));
  if (poems.length > 1) {
    box.append(el('h2', {}, 'Önceki şiirler'));
    const list = el('div', { class: 'archive' });
    poems.slice(1).forEach(p => {
      const slot = el('div'); let open = false;
      const b = el('button', { class: 'item', 'aria-expanded': 'false', onclick: () => {
        open = !open; b.setAttribute('aria-expanded', String(open));
        slot.replaceChildren(...(open ? [poemCard(p, false, false)] : []));
      } }, el('span', {}, (p.liked ? '♥ ' : '') + firstLine(p)), el('span', {}, fmt(p.created_at)));
      list.append(el('div', {}, b, slot));
    });
    box.append(list);
  }
  box.append(el('button', { class: 'btn ghost', onclick: () => refresh() }, 'Yenile'));
  return box;
}

function notifBox() {
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (supported && Notification.permission === 'granted' && store.get('sub')) return el('div');
  const box = el('div', { class: 'notice' });
  if (!supported || (ios && !standalone)) {
    box.append(el('strong', {}, 'Bildirim almak için'), el('p', { class: 'muted' }, 'Safari’de paylaş düğmesine dokun, “Ana Ekrana Ekle”yi seç, sonra uygulamayı ana ekrandaki simgeden aç.'));
    return box;
  }
  const status = el('div', { class: 'status', role: 'status' });
  const btn = el('button', { class: 'btn' }, 'Bildirimleri aç');
  btn.onclick = async () => {
    btn.disabled = true; status.className = 'status'; status.textContent = '';
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('İzin verilmedi. Ayarlar > Bildirimler bölümünden açabilirsin.');
      const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(vapid) });
      await api('subscribe', { subscription: sub.toJSON() });
      store.set('sub', '1'); status.textContent = 'Bildirimler açık.'; btn.hidden = true;
    } catch (e) { status.className = 'status err'; status.textContent = e.message; btn.disabled = false; }
  };
  box.append(el('strong', {}, 'Yeni şiir gelince sana haber vereyim mi?'), el('div', { class: 'row', style: 'margin-top:10px' }, btn), status);
  return box;
}
function b64(s) { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }

function pushMsg(push) {
  if (!push) return '';
  if (!push.devices) return ' Bildirim gönderilemedi: kayıtlı cihaz yok. Sevgilin bildirimleri açmalı.';
  return ` Bildirim: ${push.sent} cihaza gitti${push.failed ? `, ${push.failed} cihaza gidemedi` : ''}.`;
}

function writeView() {
  const draft = jget('draft', { title: '', body: '' });
  const editP = editing && poems.find(p => p.id === editing);
  const st = el('div', { class: 'status', role: 'status' });
  const show = (m, err) => { st.className = 'status' + (err ? ' err' : ''); st.textContent = m; };
  const title = el('input', { id: 'title', type: 'text', placeholder: 'Başlık (isteğe bağlı)', value: editP ? editP.title : draft.title });
  const body = el('textarea', { id: 'body', placeholder: 'Şiirini buraya yaz…' }, editP ? editP.body : draft.body);
  const count = el('div', { class: 'count' });
  const prev = el('div', { class: 'preview' });
  const upd = () => {
    const lines = body.value.split('\n').filter(x => x.trim()).length;
    count.textContent = `${body.value.length} karakter · ${lines} satır`;
    prev.replaceChildren(el('b', {}, title.value || 'Sana bir şiir var 💌'), body.value.trim().slice(0, 120) || 'Bildirimde şiirin ilk kısmı görünür.');
  };
  const saveDraft = () => { if (!editing) store.set('draft', JSON.stringify({ title: title.value, body: body.value })); upd(); };
  title.addEventListener('input', saveDraft); body.addEventListener('input', saveDraft); upd();
  const notify = el('input', { id: 'notify', type: 'checkbox', checked: !editing });
  const notifyRow = editing ? '' : el('label', { class: 'check' }, notify, 'Yayınlayınca ona bildirim gönder');
  const pub = el('button', { class: 'btn' }, editing ? 'Güncelle' : 'Yayınla');
  pub.onclick = async () => {
    pub.disabled = true;
    try {
      if (editing) {
        await api('update', { id: editing, title: title.value, body: body.value }); editing = null;
        await refresh(true); show('Şiir güncellendi.'); render(); return;
      }
      const r = await api('add', { title: title.value, body: body.value, notify: notify.checked });
      store.del('draft'); title.value = ''; body.value = ''; await refresh(true); upd();
      show('Yayınlandı.' + pushMsg(r.push));
      renderManage();
    } catch (e) { show(e.message, true); }
    pub.disabled = false;
  };
  const cancel = editing ? el('button', { class: 'btn ghost', onclick: () => { editing = null; render(); } }, 'Vazgeç') : '';

  const mt = el('input', { id: 'mt', type: 'text', placeholder: 'Başlık', value: '💌' });
  const mm = el('input', { id: 'mm', type: 'text', placeholder: 'Kısa bir mesaj yaz' });
  const ms = el('div', { class: 'status', role: 'status' });
  const send = el('button', { class: 'btn ghost' }, 'Bildirim gönder');
  send.onclick = async () => {
    send.disabled = true; ms.className = 'status';
    try { const r = await api('notify', { title: mt.value, message: mm.value }); ms.textContent = 'Gönderildi.' + pushMsg(r.push); mm.value = ''; }
    catch (e) { ms.className = 'status err'; ms.textContent = e.message; }
    send.disabled = false;
  };

  const manage = el('div', { class: 'archive' });
  function renderManage() {
    manage.replaceChildren();
    poems.forEach(p => {
      const del = el('button', { class: 'mini' }, 'Sil');
      del.onclick = async () => {
        if (del.dataset.c !== '1') { del.dataset.c = '1'; del.textContent = 'Emin misin?'; setTimeout(() => { del.dataset.c = ''; del.textContent = 'Sil'; }, 3000); return; }
        await api('delete', { id: p.id }); await refresh(true); render();
      };
      manage.append(el('div', { class: 'itemrow' },
        el('div', { class: 'item' }, el('span', {}, (p.liked ? '♥ ' : '') + firstLine(p)), el('span', {}, fmt(p.created_at))),
        el('button', { class: 'mini', onclick: () => { editing = p.id; render(); window.scrollTo(0, 0); } }, 'Düzenle'), del));
    });
  }
  renderManage();

  const statBox = stats ? el('div', { class: 'stats' },
    el('div', { class: 'stat' }, 'Bildirim alan cihaz: ', el('b', {}, String(stats.devices))),
    el('div', { class: 'stat' }, 'Beğenilen şiir: ', el('b', { class: 'heart' }, String(stats.likes)))) : '';

  return el('div', { class: 'panel' }, statBox,
    editing ? el('strong', {}, 'Şiiri düzenliyorsun') : '',
    el('div', { class: 'field' }, el('label', { for: 'title' }, 'Başlık'), title),
    el('div', { class: 'field' }, el('label', { for: 'body' }, 'Şiir'), body, count),
    notifyRow,
    editing ? '' : el('div', { class: 'field' }, el('label', {}, 'Bildirimde böyle görünür'), prev),
    el('div', { class: 'row' }, pub, cancel), st, el('hr'),
    el('h2', {}, 'Sadece bildirim'),
    el('div', { class: 'field' }, el('label', { for: 'mt' }, 'Başlık'), mt),
    el('div', { class: 'field' }, el('label', { for: 'mm' }, 'Mesaj'), mm),
    send, ms, el('hr'),
    el('h2', {}, 'Şiirler'), manage);
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && role && code) refresh(tab === 'write').then(markSeen).catch(() => {}); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>

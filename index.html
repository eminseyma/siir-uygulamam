<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anı Defterimiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anılar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Yerleşim: süzülen kalplerin üstünde cam efektli yuvarlak kartlar. Notların kenarına bantla yapışmış minik fotoğraflar. */
:root{
  --bg:#ffeef3; --bg2:#f6eaff; --surface:rgba(255,255,255,.78); --surface-solid:#fff7fa; --ink:#4b2a3b; --muted:#86596f;
  --rose:#ee5f86; --rose2:#ff8fab; --rose-deep:#c93d66; --rose-ink:#ffffff; --lav:#c9a7ee; --lav-soft:#e9dcfa; --pink-soft:#ffd9e4;
  --line:rgba(238,95,134,.22); --ok:#2f7d58; --shadow:0 10px 30px rgba(238,95,134,.16);
  --display:'Pacifico','Quicksand',cursive; --hand:'Caveat','Quicksand',cursive; --body:'Quicksand',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#261a30; --bg2:#37203f; --surface:rgba(66,42,78,.72); --surface-solid:#3a2646; --ink:#fbeaf1; --muted:#c5a3b8;
  --rose:#ff8fab; --rose2:#ffb3c7; --rose-deep:#ff9db6; --rose-ink:#3b1226; --lav:#b79be0; --lav-soft:#4b3563; --pink-soft:#5a2f48;
  --line:rgba(255,143,171,.26); --ok:#7fd1a8; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#261a30; --bg2:#37203f; --surface:rgba(66,42,78,.72); --surface-solid:#3a2646; --ink:#fbeaf1; --muted:#c5a3b8;
  --rose:#ff8fab; --rose2:#ffb3c7; --rose-deep:#ff9db6; --rose-ink:#3b1226; --lav:#b79be0; --lav-soft:#4b3563; --pink-soft:#5a2f48;
  --line:rgba(255,143,171,.26); --ok:#7fd1a8; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html[data-size="s"]{--poem-size:1.45rem}
html[data-size="m"]{--poem-size:1.75rem}
html[data-size="l"]{--poem-size:2.1rem}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;line-height:1.55;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#hearts,#hearts-top{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#hearts{z-index:0}
#hearts-top{z-index:5}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:26px 150px;display:flex;flex-direction:column;gap:18px}
body[data-view="editor"] main,body[data-view="detail"] main{padding-bottom:60px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.25;color:var(--rose)}
h2{font-family:var(--body);font-weight:700;font-size:1.1rem}
.sub{margin:-10px 0 0;color:var(--muted);font-size:.95rem;font-weight:600}
.muted{color:var(--muted);font-size:.92rem}
.cap-label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);border:0;border-radius:999px;padding:13px 24px;font-weight:700;min-height:48px;box-shadow:var(--shadow);transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.55}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=date],textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;width:100%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
textarea{min-height:200px;resize:vertical;font-family:var(--hand);font-size:1.5rem;line-height:1.35}
textarea.short{min-height:96px;font-family:var(--body);font-size:1rem;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1::first-letter{font-size:1.55em;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{display:flex;flex-direction:column;gap:16px}
.status{min-height:1.4em;font-size:.92rem;color:var(--ok);font-weight:600}
.status.err{color:var(--rose-deep)}
.offline{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:.88rem;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:var(--lav);color:#fff;font-weight:700;font-size:1.05rem;display:grid;place-items:center;flex:none;position:relative}
.avatar.b{background:var(--rose)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .mm{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.9rem;box-shadow:0 2px 6px rgba(120,60,90,.3)}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mood{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:10px 12px;min-width:0;text-align:left;min-height:64px}
.mood .t{min-width:0;display:flex;flex-direction:column}
.mood b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mood span{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--muted);min-height:44px;font-size:.92rem;font-weight:700}
.chip[aria-pressed=true]{background:linear-gradient(135deg,var(--rose2),var(--rose));border-color:transparent;color:var(--rose-ink)}
.scroll-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-chips::-webkit-scrollbar{display:none}
.scroll-chips .chip{flex:none}
.month{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.mcard{display:flex;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:16px 14px 14px 18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;min-width:0}
.mcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--lav-soft);color:var(--ink)}
.pill.o{background:var(--pink-soft)}
.mcard h3{margin:0;font-size:1rem;font-weight:700}
.mcard .pv{font-family:var(--hand);font-size:1.4rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mcard .ft{display:flex;align-items:center;gap:14px;font-size:.82rem;color:var(--muted);font-weight:700;margin-top:2px}
.cluster{flex:none;width:92px;position:relative}
.pol{position:relative;background:#fff;border-radius:6px;padding:4px 4px 12px;box-shadow:0 6px 14px rgba(120,60,90,.22);cursor:pointer;border:0}
.pol img{display:block;width:100%;object-fit:cover;border-radius:3px;background:linear-gradient(135deg,#ffc2d4,#d9c0f5)}
.pol .cp{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--hand);font-size:.85rem;color:#86596f;line-height:1.1;padding:0 4px}
.pol i{position:absolute;top:-6px;left:50%;margin-left:-14px;width:28px;height:11px;background:rgba(201,167,238,.75)}
.note{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:24px 22px 22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.note.hasph{padding-right:118px}
.note .side{position:absolute;right:-10px;top:26px;width:104px;display:flex;flex-direction:column;gap:16px;align-items:center}
.note h2.nt{color:var(--rose-deep);font-size:1.25rem;margin:8px 0 6px}
.note .text{font-family:var(--hand);font-size:var(--poem-size,1.75rem);line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.note .when{font-size:.78rem;color:var(--muted);font-weight:600}
.bubble{border-radius:20px 20px 20px 6px;padding:10px 16px;font-family:var(--hand);font-size:1.45rem;line-height:1.2;background:var(--pink-soft);overflow-wrap:anywhere;max-width:86%}
.bubble.me{border-radius:20px 20px 6px 20px;background:var(--lav-soft);align-self:flex-end}
.bwho{font-size:.72rem;color:var(--muted);font-weight:600;margin:0 6px}
.replies{display:flex;flex-direction:column;gap:6px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:4px;background:var(--surface-solid);border:1.5px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.nav button{position:relative;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:700;font-size:.85rem}
.navdot{position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--rose-deep);border:1.5px solid var(--surface-solid)}
.nav button[aria-current=page]{background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink)}
.nav svg{width:18px;height:18px}
.fab{position:fixed;z-index:6;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--rose2),var(--rose));display:grid;place-items:center;box-shadow:0 10px 24px rgba(217,63,107,.4)}
.fab svg{width:26px;height:26px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(40,16,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface-solid);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h2{font-family:var(--display);font-weight:400;color:var(--rose);font-size:1.4rem}
.lb{position:fixed;inset:0;z-index:30;background:rgba(20,8,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lb img{max-width:100%;max-height:72vh;border-radius:10px;background:#000}
.lb .cp{color:#fff;font-family:var(--hand);font-size:1.5rem}
.slots{display:flex;gap:14px;flex-wrap:wrap}
.slot{position:relative}
.slot .rm{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 6px rgba(120,60,90,.3);display:grid;place-items:center;z-index:2}
.addph{width:84px;height:84px;border-radius:14px;border:2px dashed var(--line);background:var(--surface);color:var(--rose-deep);font-size:.75rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:10px 16px;min-height:48px;font-weight:700;font-size:.95rem}
.toggle input{width:26px;height:26px;accent-color:var(--rose);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 button{border:0;padding:0;background:#fff;border-radius:10px;overflow:hidden;aspect-ratio:1;box-shadow:0 4px 10px rgba(120,60,90,.18)}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px}
.empty .big{font-family:var(--hand);font-size:1.9rem;line-height:1.3;color:var(--rose)}
.notice{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:14px 18px}
.poem{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:30px 24px 22px;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.poem.latest::before{content:"♥";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);font-size:1.1rem;box-shadow:var(--shadow)}
.poem h2{font-weight:700;font-size:1.25rem;margin-bottom:12px;color:var(--rose-deep);text-align:center}
.poem .text{font-family:var(--hand);font-size:var(--poem-size,1.75rem);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.poem .date{margin-top:18px;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:600}
.seenline{margin-top:6px;text-align:center;font-size:.82rem;color:var(--muted);font-weight:600}
.seenline.yes{color:var(--ok)}
.badge{display:inline-block;background:var(--lav);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.archive{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;text-align:left;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;width:100%;min-width:0}
.item span:first-child{font-family:var(--hand);font-size:1.4rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span:last-child{color:var(--muted);font-size:.78rem;flex:none;align-self:center;font-weight:700}
.item[aria-expanded=true]{border-color:var(--rose)}
.archive .poem{margin-top:12px}
.itemrow{display:flex;align-items:center;gap:8px}
.itemrow .item{flex:1}
.mini{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.82rem;min-height:42px;font-weight:700}
.seen-yes{color:var(--ok)!important}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--muted);font-weight:700}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--rose2),var(--rose));color:var(--rose-ink);border-color:transparent}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9rem;font-weight:600}
.count{font-size:.8rem;color:var(--muted);text-align:right}
.preview{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;font-size:.92rem}
.preview b{display:block}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--rose)}
hr{border:0;border-top:1.5px dashed var(--line);width:100%;margin:6px 0}
@media (prefers-reduced-motion:no-preference){
  .note,.mcard,.poem{animation:in .5s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}}
  .poem.latest::before{animation:beat 2.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.12)}}
}
</style>
</head>
<body>
<canvas id="hearts" aria-hidden="true"></canvas>
<canvas id="hearts-top" aria-hidden="true"></canvas>
<main id="app"></main>
<div id="chrome"></div>

<script>
/* Süzülen kalpler. Belirli aralıklarla toplanıp "E Ş" harflerini oluşturur, sonra yeniden dağılır. */
(() => {
  const cvB = document.getElementById('hearts'), cvT = document.getElementById('hearts-top'); if (!cvB || !cvT) return;
  const cb = cvB.getContext('2d'), ct = cvT.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, hearts = [], colors = [], raf = 0, last = 0, now = 0;
  let phase = 'float', phaseT = 0, nextAt = 6, targets = null, topDirty = false;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const readColors = () => { const cs = getComputedStyle(document.documentElement);
    colors = ['--rose', '--rose2', '--lav'].map(k => cs.getPropertyValue(k).trim() || '#ee5f86'); };
  function path(ctx, s) { ctx.beginPath(); ctx.moveTo(0, s * .32); ctx.bezierCurveTo(-s * .56, -s * .12, -s * .38, -s * .62, 0, -s * .28);
    ctx.bezierCurveTo(s * .38, -s * .62, s * .56, -s * .12, 0, s * .32); ctx.closePath(); }
  function make(init) { const size = 8 + Math.random() * 20;
    return { x: Math.random() * W, y: init ? Math.random() * H : H + size, s: size, v: 8 + Math.random() * 18, sw: 6 + Math.random() * 14,
      ph: Math.random() * 6.28, sp: .4 + Math.random() * .8, rot: (Math.random() - .5) * .8, c: Math.floor(Math.random() * 3),
      a: .28 + Math.random() * .42, out: Math.random() < .35, mode: 'free', vx: 0, tmp: false, life: 0, px: 0, py: 0, g: 0 }; }
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    for (const cv of [cvB, cvT]) { cv.width = W * d; cv.height = H * d; }
    cb.setTransform(d, 0, 0, d, 0, 0); ct.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(Math.min(56, Math.max(28, W * H / 11000))); hearts = Array.from({ length: n }, () => make(true));
    phase = 'float'; targets = null; readColors(); if (reduce) drawStatic(); }

  function buildTargets() {
    const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    const fs = Math.min(W * 0.52, H * 0.3, 240);
    o.font = `700 ${fs}px Quicksand, system-ui, sans-serif`; o.textAlign = 'center'; o.textBaseline = 'alphabetic';
    const wE = o.measureText('E').width, wS = o.measureText('Ş').width, gap = fs * 0.52;
    const total = wE + wS + gap, x0 = W / 2 - total / 2, base = H * 0.42 + fs * 0.36;
    o.fillStyle = '#000'; o.fillText('E', x0 + wE / 2, base); o.fillText('Ş', x0 + wE + gap + wS / 2, base);
    const data = o.getImageData(0, 0, W, H).data;
    let step = Math.max(8, Math.round(fs / 20)), pts = [];
    for (let tries = 0; tries < 6; tries++) { pts = [];
      for (let y = base - fs * 0.9; y < base + fs * 0.35; y += step) for (let x = x0 - 4; x < x0 + total + 4; x += step) {
        const xi = Math.round(x), yi = Math.round(y); if (xi < 0 || yi < 0 || xi >= W || yi >= H) continue;
        if (data[(yi * W + xi) * 4 + 3] > 128) pts.push({ x: x + (Math.random() - .5) * 2, y: y + (Math.random() - .5) * 2 }); }
      if (pts.length <= 260) break; step += 1; }
    // E ile Ş arasında bir kalp
    const hcx = x0 + wE + gap / 2, hcy = base - fs * 0.36, hs = fs * 0.14, hstep = Math.max(4, step * 0.7);
    for (let y = hcy - hs * 1.3; y <= hcy + hs * 1.3; y += hstep) for (let x = hcx - hs * 1.3; x <= hcx + hs * 1.3; x += hstep) {
      const X = (x - hcx) / hs, Y = -(y - hcy) / hs; const f = Math.pow(X * X + Y * Y - 1, 3) - X * X * Y * Y * Y;
      if (f <= 0) pts.push({ x, y }); }
    return { pts, size: Math.max(9, step * 1.0) };
  }

  function startGather() {
    if (!targets) targets = buildTargets();

    let pool = hearts.filter(h => h.mode === 'free' && !h.tmp);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    pool = pool.slice(0, tg.length);
    while (pool.length < tg.length) { const h = make(false); h.tmp = true; h.x = Math.random() * W; h.y = H + Math.random() * 120; h.px = h.x; h.py = h.y; hearts.push(h); pool.push(h); }
    pool.sort((a, b) => a.px - b.px); tg.sort((a, b) => a.x - b.x);
    pool.forEach((h, i) => { h.mode = 'gather'; h.sx = h.px; h.sy = h.py; h.ss = h.s; h.sa = h.a; h.tx = tg[i].x; h.ty = tg[i].y; h.delay = Math.random() * .7; h.g = 0; h.c = i % 2; h.out = false; });
    return true;
  }
  function release() {
    for (const h of hearts) if (h.mode !== 'free') { h.mode = 'free'; h.x = h.px; h.y = h.py; h.vx = (Math.random() - .5) * 90; h.v = 10 + Math.random() * 30;
      h.s = h.ss; h.a = h.sa; if (h.tmp) h.life = 2.2; }
  }

  function drawHeart(ctx, h, x, y, s, a, filled) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(h.rot + Math.sin(now * h.sp + h.ph) * .15); ctx.globalAlpha = a; path(ctx, s);

  function tick(ts) {

    } else if (phase === 'gather' && phaseT > 3) { phase = 'hold'; phaseT = 0; }
    else if (phase === 'hold' && phaseT > 3.8) { release(); phase = 'float'; nextAt = now + 24 + Math.random() * 16; }

    cb.clearRect(0, 0, W, H); let anyTop = false;
    for (let i = hearts.length - 1; i >= 0; i--) { const h = hearts[i];
      if (h.mode === 'free') {
        h.y -= h.v * dt; h.x += h.vx * dt; h.vx *= Math.max(0, 1 - dt * 1.4);
        if (h.tmp) { h.life -= dt; if (h.life <= 0 || h.y < -h.s * 2) { hearts.splice(i, 1); continue; } }
        else if (h.y < -h.s * 2) { Object.assign(h, make(false), { x: Math.random() * W }); }
        h.px = h.x + Math.sin(now * h.sp + h.ph) * h.sw; h.py = h.y;

        h.px = x; h.py = y;

  }

async function shrink(file) {

function chatWriteView() {

    manage.append(el('div', { class: 'itemrow' }, el('div', { class: 'item' }, el('span', {}, (m.liked ? '♥ ' : '') + cFirst(m)), el('span', { class: m.seen_at ? 'seen-yes' : '' }, m.seen_at ? '✓ Gördü' : 'Görmedi')),

    el('h2', {}, 'Yazdıklarım'), manage);

/* ---------- Şiirler ---------- */
function markPoemsSeen() {
  if (role !== 'reader' || tab !== 'read' || document.visibilityState === 'hidden') return;
  poems.forEach(p => seenPoems.add(p.id)); store.set('seen', JSON.stringify([...seenPoems]));
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
  const ids = poems.filter(p => !p.seen_at).map(p => p.id); const nowIso = new Date().toISOString();
  ids.forEach(id => { const p = poems.find(x => x.id === id); if (p) p.seen_at = nowIso; });
  api('seen', { ids }).catch(() => { ids.forEach(id => { const p = poems.find(x => x.id === id); if (p) p.seen_at = null; }); });
}
function copyText(text, btn) { const old = btn.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => btn.textContent = 'Kopyalandı').catch(() => btn.textContent = 'Kopyalanamadı');
  setTimeout(() => btn.textContent = old, 1500); }
function sizeChip() { const order = ['s', 'm', 'l'];
  return el('button', { class: 'chip', type: 'button', 'aria-label': 'Yazı boyutunu değiştir', onclick: () => { const cur = document.documentElement.dataset.size || 'm';
    const next = order[(order.indexOf(cur) + 1) % 3]; document.documentElement.dataset.size = next; store.set('size', next); } }, 'Aa'); }
function poemCard(p, latest, isNew) {
  const likeBtn = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(!!p.liked), onclick: async () => {
    const next = !p.liked; p.liked = next; likeBtn.setAttribute('aria-pressed', String(next)); likeBtn.textContent = next ? '♥ Beğendim' : '♡ Beğen';
    try { await api('like', { id: p.id, liked: next }); } catch (e) { p.liked = !next; likeBtn.setAttribute('aria-pressed', String(!next)); likeBtn.textContent = !next ? '♥ Beğendim' : '♡ Beğen'; }
  } }, p.liked ? '♥ Beğendim' : '♡ Beğen');
  const copyBtn = el('button', { class: 'chip', type: 'button', onclick: () => copyText((p.title ? p.title + '\n\n' : '') + p.body, copyBtn) }, 'Kopyala');
  return el('article', { class: 'poem' + (latest ? ' latest' : '') },
    p.title ? el('h2', {}, p.title, isNew ? el('span', { class: 'badge' }, 'Yeni') : '') : (isNew ? el('span', { class: 'badge' }, 'Yeni') : ''),
    el('div', { class: 'text' }, p.body), el('div', { class: 'date' }, fmt(p.created_at) + (p.updated_at ? ' · düzenlendi' : '')),
    role === 'admin' ? el('div', { class: 'seenline' + (p.seen_at ? ' yes' : '') }, p.seen_at ? '✓ Gördü · ' + fmtT(p.seen_at) : 'Henüz görmedi') : '',
    el('div', { class: 'actions' }, role === 'admin' ? '' : likeBtn, copyBtn, sizeChip()));
}
function poemsView() {
  const box = el('div', { class: 'panel' });
  const head = header('Şiirlerim Sana', role === 'reader' ? 'Her satırı senin için ♥' : '');
  if (role === 'admin') head.append(el('div', { class: 'tabs', role: 'tablist' },
    el('button', { role: 'tab', 'aria-selected': String(tab === 'read'), onclick: () => { tab = 'read'; render(); } }, 'Oku'),
    el('button', { role: 'tab', 'aria-selected': String(tab === 'write'), onclick: () => { tab = 'write'; render(); } }, 'Yaz')));
  box.append(head, tab === 'write' && role === 'admin' ? poemWriteView() : poemReadView());
  return box;
}
function poemReadView() {
  const box = el('div', { class: 'panel' });
  if (!poems.length) { box.append(el('div', { class: 'empty' }, el('div', { class: 'big' }, 'Gönlümden dökülenler ♥'), el('div', { class: 'muted' }, 'İlk şiir gelince burada görünecek.'))); return box; }
  const isNew = p => role === 'reader' && !seenPoems.has(p.id);
  box.append(poemCard(poems[0], true, isNew(poems[0])));
  if (poems.length > 1) {
    box.append(el('h2', {}, 'Önceki şiirler'));

    poems.slice(1).forEach(p => { const slot = el('div'); let open = false;
      const b = el('button', { class: 'item', 'aria-expanded': 'false', onclick: () => { open = !open; b.setAttribute('aria-expanded', String(open)); slot.replaceChildren(...(open ? [poemCard(p, false, false)] : [])); } },
        el('span', {}, (p.liked ? '♥ ' : '') + firstLine(p)), el('span', {}, fmt(p.created_at))); list.append(el('div', {}, b, slot)); });
    box.append(list);
  }
  if (role === 'reader') box.append(el('p', { class: 'muted', style: 'text-align:center;font-size:.8rem;margin:0' }, 'Şiirleri okuduğunda ona görünür ♥'));

function pushMsg(push) { if (!push) return ''; if (!push.devices) return ' Bildirim gönderilemedi: kayıtlı cihaz yok. Sevgilin bildirimleri açmalı.';
  return ` Bildirim: ${push.sent} cihaza gitti${push.failed ? `, ${push.failed} cihaza gidemedi` : ''}.`; }
